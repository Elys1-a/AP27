<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>APRIL27</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            gap: 20px;
            position: relative;
            overflow-x: hidden;
        }

        .cake-container {
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .cake-svg {
            filter: drop-shadow(0 12px 24px rgba(0,0,0,0.3));
        }

        .candle-area {
            cursor: pointer;
        }

        .flame {
            opacity: 0;
            transition: opacity 0.3s ease;
        }

        .flame.lit {
            opacity: 1;
        }

        .light-button {
            padding: 15px 30px;
            font-size: 18px;
            font-weight: bold;
            background: linear-gradient(135deg, #FF9DC0, #E86B9E);
            border: none;
            border-radius: 25px;
            color: white;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(232, 107, 158, 0.4);
            transition: all 0.3s ease;
            font-family: Arial, sans-serif;
            z-index: 10;
        }

        .light-button:hover {
            transform: scale(1.05);
            box-shadow: 0 6px 20px rgba(232, 107, 158, 0.6);
        }

        .light-button:active {
            transform: scale(0.98);
        }

        .instructions {
            color: #FFB8D0;
            font-family: Arial, sans-serif;
            font-size: 14px;
            text-align: center;
            z-index: 10;
        }

        /* Confetti canvas */
        #confetti-canvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 1000;
        }

        /* "HAPPY BIRTHDAY" text - beige color with elegant font */
        .birthday-message {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%) scale(0);
            font-family: 'Georgia', 'Times New Roman', 'Poppins', cursive;
            font-size: 52px;
            font-weight: bold;
            color: #F5E6C8;  /* beige / cream color */
            background: transparent;
            padding: 0;
            border: none;
            box-shadow: none;
            text-shadow: none;
            letter-spacing: 2px;
            z-index: 2000;
            pointer-events: none;
            white-space: nowrap;
            transition: transform 0.4s cubic-bezier(0.68, -0.55, 0.265, 1.55);
        }

        .birthday-message.show {
            transform: translate(-50%, -50%) scale(1);
        }

        @media (max-width: 600px) {
            .birthday-message {
                font-size: 28px;
                white-space: nowrap;
                letter-spacing: 1px;
            }
        }
    </style>
</head>
<body>
    <canvas id="confetti-canvas"></canvas>
    <div id="birthdayMessage" class="birthday-message">HAPPY BIRTHDAY</div>

                <linearGradient id="middlePink" x1="0%" y1="0%" x2="0%" y2="100%">

                <linearGradient id="topPink" x1="0%" y1="0%" x2="0%" y2="100%">

                <!-- Brown icing gradients -->

                <!-- Flame gradients -->

                    <stop offset="40%" stop-color="#FF6600" />

                <linearGradient id="flameInner" x1="0%" y1="100%" x2="0%" y2="0%">

                <!-- Candy glow filter -->

                    <feGaussianBlur in="SourceAlpha" stdDeviation="0.8" />
                    <feOffset dx="0" dy="1" />

            <!-- CANDLES WITH CLICKABLE AREAS AND STATIC FLAMES -->
            
            <!-- Left Candle -->
            <g class="candle-area" onclick="toggleFlame('flame1')">

                    <ellipse cx="181" cy="72" rx="7" ry="14" fill="url(#flameOuter)" />

            <!-- Center Candle (taller) -->
            <g class="candle-area" onclick="toggleFlame('flame2')">

                    <ellipse cx="271" cy="74" rx="4" ry="8" fill="url(#flameInner)" />

    <button class="light-button" onclick="celebrateAndLight()">Blow before you click</button>
    <script>
        // Confetti system
        const canvas = document.getElementById('confetti-canvas');
        const ctx = canvas.getContext('2d');
        let animationId = null;
        let particles = [];
        let confettiActive = false;

        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        class ConfettiParticle {
            constructor() {
                this.x = Math.random() * canvas.width;
                this.y = Math.random() * canvas.height - canvas.height;
                this.size = Math.random() * 8 + 4;
                this.speedY = Math.random() * 5 + 3;
                this.speedX = (Math.random() - 0.5) * 3;
                this.rotation = Math.random() * Math.PI * 2;
                this.rotationSpeed = (Math.random() - 0.5) * 0.2;
                const colors = ['#FF4D4D', '#FFD700', '#FF69B4', '#4CFF4C', '#FFA500', '#00BFFF', '#FF6B9D', '#9B59B6', '#FFE066', '#66FF88'];
                this.color = colors[Math.floor(Math.random() * colors.length)];
            }

            update() {
                this.y += this.speedY;
                this.x += this.speedX;
                this.rotation += this.rotationSpeed;
                return this.y < canvas.height + this.size;
            }

            draw() {
                ctx.save();
                ctx.translate(this.x, this.y);
                ctx.rotate(this.rotation);
                ctx.fillStyle = this.color;
                ctx.fillRect(-this.size / 2, -this.size / 2, this.size, this.size * 0.7);
                ctx.restore();
            }
        }

        function startConfetti(duration = 3000) {
            if (confettiActive) {
                // Add more particles for extra fun
                for (let i = 0; i < 100; i++) {
                    particles.push(new ConfettiParticle());
                }
                return;
            }
            
            confettiActive = true;
            particles = [];
            // Create 250 confetti pieces for a bigger celebration
            for (let i = 0; i < 250; i++) {
                particles.push(new ConfettiParticle());
            }
            
            function animateConfetti() {
                if (!confettiActive && particles.length === 0) {
                    if (animationId) cancelAnimationFrame(animationId);
                    animationId = null;
                    ctx.clearRect(0, 0, canvas.width, canvas.height);
                    return;
                }
                
                ctx.clearRect(0, 0, canvas.width, canvas.height);
                
                // Update and draw particles
                particles = particles.filter(p => p.update());
                particles.forEach(p => p.draw());
                
                animationId = requestAnimationFrame(animateConfetti);
            }
            
            animateConfetti();
            
            // Stop after duration
            setTimeout(() => {
                confettiActive = false;
                // Clear remaining particles gracefully
                setTimeout(() => {
                    if (!confettiActive && particles.length > 0) {
                        particles = [];
                        ctx.clearRect(0, 0, canvas.width, canvas.height);
                        if (animationId) cancelAnimationFrame(animationId);
                        animationId = null;
                    }
                }, 500);
            }, duration);
        }

        // Show birthday message with beige color and custom font
        let messageTimeout = null;
        function showBirthdayMessage() {
            const messageEl = document.getElementById('birthdayMessage');
            
            // Remove class if already there to restart animation
            messageEl.classList.remove('show');
            
            // Force reflow to restart animation
            void messageEl.offsetWidth;
            
            // Add class to show with scale animation
            messageEl.classList.add('show');
            
            // Clear any existing timeout
            if (messageTimeout) clearTimeout(messageTimeout);
            
            // Hide after 2.5 seconds
            messageTimeout = setTimeout(() => {
                messageEl.classList.remove('show');
            }, 2500);
        }

        // Flame toggle functions
        function toggleFlame(flameId) {
            const flame = document.getElementById(flameId);
            flame.classList.toggle('lit');
        }

        function lightAllCandles() {
            const flames = document.querySelectorAll('.flame');
            const allLit = Array.from(flames).every(f => f.classList.contains('lit'));
            
            flames.forEach(flame => {
                if (allLit) {
                    flame.classList.remove('lit');
                } else {
                    flame.classList.add('lit');
                }
            });
        }

        // Combined celebration: light candles, burst confetti, and show birthday message
        function celebrateAndLight() {
            const flames = document.querySelectorAll('.flame');
            const allLit = Array.from(flames).every(f => f.classList.contains('lit'));
            
            // If candles are not all lit, light them all
            if (!allLit) {
                flames.forEach(flame => {
                    flame.classList.add('lit');
                });
            }
            
            // Trigger confetti celebration
            startConfetti(3000);
            
            // Show "HAPPY BIRTHDAY" message with beige color and elegant font
            showBirthdayMessage();
            
            // Optional: Add a little visual feedback on button
            const btn = document.querySelector('.light-button');
            btn.style.transform = 'scale(0.98)';
            setTimeout(() => {
                btn.style.transform = '';
            }, 150);
        }
    </script>
</body>
</html>
